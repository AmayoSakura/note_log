name: Collect note data

on:
  schedule:
    - cron: '15 15 * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect note data
        run: python collect_note.py

      - name: Generate HTML dashboard
        run: python generate_html.py

      - name: Save collected data and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add note_data.json data/ index.html

          git diff --cached --quiet || git commit -m "Update note data and dashboard"

          git push
